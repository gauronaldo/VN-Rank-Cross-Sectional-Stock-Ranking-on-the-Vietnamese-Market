[project]
name = "vn-rank"
version = "0.1.0"
description = "Cross-sectional ranking of Vietnamese stocks by 5-day forward return, net of trading costs."
readme = "README.md"
requires-python = ">=3.11"
# Exact pins: every version below resolves on Python 3.11 through 3.13.
# vnstock is intentionally absent until Phase 1: the PyPI project is quarantined and
# generation 5 is distributed from a separate package index (see docs/design_notes.md).
dependencies = [
    "duckdb==2.0.0",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "mlflow==3.18.0",
    "numpy==2.4.6",
    "optuna==5.0.0",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "shap==0.51.0",
    "statsmodels==0.15.0",
    "torch==2.15.0",
    "tqdm==4.70.1",
]

[project.scripts]
vn-rank = "vn_rank.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import sorting
    "N",            # naming
    "D",            # docstrings
    "UP",           # modern syntax
    "B",            # bugbear
    "BLE",          # no blind except
    "C90",          # complexity
    "PL",           # pylint rules (argument count, magic values, branches)
    "PTH",          # pathlib over os.path
    "RUF",
    "SIM",
    "T20",          # no print
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 8
max-statements = 30

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# PyYAML ships no type information; installing types-PyYAML needs approval (AGENT.md 2.2).
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
