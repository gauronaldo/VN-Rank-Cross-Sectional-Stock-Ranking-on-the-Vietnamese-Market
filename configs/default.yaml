# VN-Rank default configuration.
# Every tunable value lives here (AGENT.md 5.1). Values set to null are decisions that the
# user takes in the phase noted next to them; code that needs them must refuse to run
# while they are null.

project:
  seed: 42                      # global seed for deterministic components
  figure_dpi: 150               # resolution of figures saved to reports/

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: reports
  mlruns_dir: mlruns

data:
  source: vci                   # one adjusted-price source only; never mix vci and kbs
  index_symbol: VNINDEX
  # Exchange codes as returned by vnstock (verified in Phase 1). DELISTED holds symbols that
  # are no longer listed; they are kept to reduce survivorship bias (protocol changelog).
  exchanges: [HOSE, HNX, UPCOM, DELISTED]
  history_start: 2018-11-01     # requested start; Community tier caps history at 2,920 days
  request_interval_seconds: 1.2 # ~50 requests/minute, under the Community limit of 60
  max_rows_per_request: 10000   # Community row cap; index ohlcv returns only 1,000 rows if unset
  max_retries: 5
  retry_backoff_seconds: 30.0
  band_check_tolerance: 0.001   # slack on |return| > price band before a row is flagged

universe:
  min_history_days: 252         # trading days of history required up to t
  traded_value_window: 60       # window for the median traded value filter
  min_traded_value_vnd: 1000000000.0  # 1 billion VND (decided in Phase 2; sensitivity 0.5/2/5 bn in Phase 6)

label:
  horizon_days: 5               # h: holding period in trading days
  entry_lag_days: 1             # signal at close t, entry at close t+1
  target: rank                  # rank (scaled to [0, 1]) or zscore, computed per date

features:
  return_windows: [1, 5, 20, 60, 120]
  volatility_windows: [20, 60]
  atr_window: 14
  rsi_window: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_window: 20
  bollinger_num_std: 2.0
  traded_value_window: 20
  volume_ratio_window: 20
  amihud_window: 20
  high_window: 252

validation:
  train_start: 2019-11-01       # first date after the 252-day feature warm-up
  walk_forward_start: 2022-01-01
  walk_forward_end: 2025-09-30
  lockbox_start: 2025-10-01     # evaluated once, in Phase 7, behind the lockbox guard
  test_block_months: 6
  inner_validation_months: 6    # tuning window = last months of each training window
  embargo_days: 10              # trading days dropped after the purged train end
  min_stocks_per_date: 50       # dates with fewer eligible stocks are dropped from training and evaluation

models:
  seeds: [0, 1, 2, 3, 4]        # seeds for stochastic models (MLP, bagged LightGBM)
  momentum_window: 20           # baseline: rank of the 20-day return
  reversal_window: 5            # baseline: minus the rank of the 5-day return
  missing_rank_fill: 0.5        # Elastic Net only (median rank); LightGBM keeps NaN natively
  elastic_net_max_iter: 10000
  lightgbm:                     # fixed, not tuned
    learning_rate: 0.05
    max_boost_rounds: 1000
    early_stopping_rounds: 50   # on inner-validation L2 loss
    bagging_freq: 1             # bagging on every iteration (bagging_fraction is tuned)
  mlp:                          # fixed, not tuned (Phase 4)
    batch_size: 4096
    max_epochs: 30
    patience: 5                 # epochs without inner-validation L2 improvement before stopping
  # Optuna (TPE, seeded with project.seed) inside each training window only; the objective
  # is mean daily Rank IC on the inner validation window. Approved at the start of Phase 3.
  tuning:
    n_trials: 30                # per model per fold
    elastic_net:
      alpha: {low: 1.0e-5, high: 0.1, log: true, integer: false}
      l1_ratio: {low: 0.05, high: 1.0, log: false, integer: false}
    lightgbm:
      num_leaves: {low: 8, high: 128, log: true, integer: true}
      min_child_samples: {low: 100, high: 5000, log: true, integer: true}
      lambda_l1: {low: 1.0e-3, high: 10.0, log: true, integer: false}
      lambda_l2: {low: 1.0e-3, high: 100.0, log: true, integer: false}
      feature_fraction: {low: 0.5, high: 1.0, log: false, integer: false}
      bagging_fraction: {low: 0.5, high: 1.0, log: false, integer: false}
    mlp:                        # chosen by the agent in Phase 4 under the author's standing approval
      hidden_units: {low: 16, high: 128, log: true, integer: true}
      n_layers: {low: 2, high: 3, log: false, integer: true}
      dropout: {low: 0.0, high: 0.5, log: false, integer: false}
      weight_decay: {low: 1.0e-6, high: 0.01, log: true, integer: false}
      learning_rate: {low: 1.0e-4, high: 0.01, log: true, integer: false}

evaluation:
  n_quantiles: 5                # quintile returns
  tripwire_mean_ic: 0.10        # leakage tripwire (protocol 9): walk-forward mean Rank IC above this
  tripwire_fold_ic: 0.20        # ... or any single fold above this stops work
  trading_days_per_year: 252    # annualization (protocol 8)
  bootstrap_block_days: 20      # moving-block bootstrap (protocol 8)
  bootstrap_resamples: 10000
  confidence_level: 0.95

# Phase 5 defaults chosen under the author's standing approval (2026-11-07), checked against
# 2025 broker data: large brokers' effective fee is about 0.16-0.17% (range 0.1-0.3%).
backtest:
  top_quantile: 0.1             # long-only top decile, equal weight
  # Secondary turnover-control variant (AGENT.md 3.7): keep a holding while it ranks in the
  # top 20%, fill vacated slots from the top 10%. Added after the Phase 5 walk-forward
  # backtest showed 33x annual turnover; the band is the spec's value, not tuned.
  turnover_band: 0.2
  portfolio_value_vnd: 10000000000.0  # 10 billion VND, sets the liquidity cap in VND
  limit_hit_margin: 0.005       # a close within 0.5 pp of the band counts as limit-locked
  costs:
    brokerage_fee_per_side: 0.0015  # 0.15% per side
    selling_tax: 0.001              # 0.1% tax on the sell side
    slippage_per_side: 0.001        # 0.10% per side (universe trades >= 1 bn VND per day)
  price_limits:                 # daily band per exchange, verified for 2025 (HOSE 7%, HNX 10%, UPCoM 15%)
    HOSE: 0.07
    HNX: 0.10
    UPCOM: 0.15
    DELISTED: 0.15              # original exchange unknown; use the widest band
  position_cap_adv_window: 20
  max_position_fraction_of_adv: 0.1  # at most 10% of the 20-day average traded value per stock

# Phase 6: every run reuses the unchanged walk-forward protocol (LightGBM, same tuning).
ablation:
  liquidity_thresholds_vnd: [500000000.0, 2000000000.0, 5000000000.0]  # protocol changelog 2026-11-07
  brokerage_fees: [0.0005, 0.001, 0.0015, 0.0025, 0.0035]  # cost sensitivity grid, per side
  slippages: [0.0, 0.0005, 0.001, 0.002, 0.003]             # per side
  shap_sample_rows: 5000        # test rows of the last fold explained in the SHAP summary
